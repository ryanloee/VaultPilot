name: Linux CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils dpkg-dev libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build Linux CLI artifacts
        run: |
          chmod +x scripts/build-linux-cli.sh
          ./scripts/build-linux-cli.sh --platforms x64 --format all

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: vaultpilot-cli-linux-x64
          path: |
            artifacts/linux-cli/bin/linux-x64/vaultpilot-cli
            artifacts/linux-cli/packages/linux-x64/*.deb
          if-no-files-found: error
          retention-days: 7
