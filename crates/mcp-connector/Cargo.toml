[package]
name = "vaultpilot-mcp"
version = "0.1.0"
description = "Standalone MCP Stdio connector — lets Claude Desktop / Cursor / Codex read & write VaultPilot vault"
edition = "2021"
license = "MIT"
repository = "https://github.com/ryanloee/VaultPilot"

[dependencies]
vaultpilot_lib = { package = "vaultpilot", path = "../.." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-std", "io-util", "signal", "sync", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
