name: Android Build & Test

on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
  pull_request:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npx expo export --platform android
        name: Export Android bundle (type-check + bundle)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK (EAS local)
        run: |
          npx eas-cli build --platform android --profile preview --local --non-interactive \
            --output ./app-preview.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: mobile/app-preview.apk
          retention-days: 30

      - name: Install APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install mobile/app-preview.apk
            adb shell am start -n com.vaultpilot.mobile/.MainActivity
            sleep 10
            adb shell screencap /sdcard/launch.png
            adb pull /sdcard/launch.png mobile/launch-test.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshot-${{ github.sha }}
          path: mobile/launch-test.png
