[package]
name = "vaultpilot"
version = "0.2.8"

description = "Local-first knowledge-base assistant with Windows UI and cross-platform CLI"
edition = "2021"
license = "MIT"
repository = "https://github.com/ryanloee/VaultPilot"
homepage = "https://github.com/ryanloee/VaultPilot"

[lib]
name = "vaultpilot_lib"
crate-type = ["rlib"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
axum = { version = "0.7", features = ["http1", "json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
deunicode = "1"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["net", "process", "time", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
url = "2"
bytes = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "vaultpilot-cli"
path = "src/bin/vaultpilot-cli.rs"
