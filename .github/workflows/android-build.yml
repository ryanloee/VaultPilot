name: Android Build

on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Expo export (bundle check)
        run: npx expo export --platform android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild (generate native project)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-boot-timeout: 300
          script: |
            APK="$GITHUB_WORKSPACE/mobile/android/app/build/outputs/apk/release/app-release.apk"

            if [ ! -f "$APK" ]; then
              echo "FAILED: APK not found at $APK"
              exit 1
            fi

            echo "=== Android Emulator Smoke Test ==="
            echo "APK: $APK"

            # Clear logcat
            adb logcat -c

            # Install the APK
            echo "Installing APK..."
            adb install "$APK"
            if [ $? -ne 0 ]; then
              echo "FAILED: APK install failed"
              exit 1
            fi

            # Launch the app
            echo "Launching app..."
            adb shell am start -n com.vaultpilot.mobile/.MainActivity

            # Wait for app to fully start (React Native needs time to bundle)
            echo "Waiting 20s for app to start..."
            sleep 20

            # Check if the app is still running (not crashed)
            PID=$(adb shell pidof com.vaultpilot.mobile)
            if [ -z "$PID" ]; then
              echo "FAILED: App crashed on startup"
              echo "--- Logcat output ---"
              adb logcat -d | grep -i "FATAL\|AndroidRuntime\|ReactNative\|com.vaultpilot" | tail -50
              echo "--- End logcat ---"
              exit 1
            fi

            echo "App is running with PID $PID"

            # Check for fatal exceptions in logcat
            FATAL=$(adb logcat -d | grep -c "FATAL EXCEPTION")
            if [ "$FATAL" -gt 0 ]; then
              echo "FAILED: Found $FATAL FATAL EXCEPTION(s) in logcat:"
              adb logcat -d | grep -A10 "FATAL EXCEPTION" | head -30
              exit 1
            fi

            # Check for React Native JS errors
            JS_ERRORS=$(adb logcat -d | grep -c "ReactNativeJS.*Error")
            if [ "$JS_ERRORS" -gt 0 ]; then
              echo "WARNING: Found $JS_ERRORS React Native JS errors (non-fatal):"
              adb logcat -d | grep "ReactNativeJS.*Error" | head -5
            fi

            # Take a screenshot for visual verification (optional artifact)
            adb shell screencap /sdcard/smoke-test.png
            adb pull /sdcard/smoke-test.png smoke-test.png 2>/dev/null || true

            echo "=== SMOKE TEST PASSED ==="

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot-${{ github.sha }}
          path: mobile/smoke-test.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: release-assets/android

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="release-assets/android/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK"
            exit 1
          fi

          if ! gh release view "$TAG" --json id > /dev/null 2>&1; then
            gh release create "$TAG" --title "VaultPilot ${TAG#v}" --notes ""
          fi

          gh release upload "$TAG" "$APK" --clobber
          echo "Uploaded APK to release $TAG"
