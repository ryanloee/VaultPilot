name: Windows Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            rust_target: i686-pc-windows-msvc
            channel: win-x86
          - platform: x64
            rust_target: x86_64-pc-windows-msvc
            channel: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Velopack CLI
        shell: powershell
        run: dotnet tool install --global vpk --version 0.0.1298

      - name: Resolve app version
        id: version
        shell: powershell
        run: |
          $cargo = Get-Content Cargo.toml
          $line = $cargo | Where-Object { $_ -match '^version\s*=\s*".*"$' } | Select-Object -First 1
          if (-not $line) {
            throw "Unable to resolve version from Cargo.toml"
          }
          $version = [regex]::Match($line, '"([^"]+)"').Groups[1].Value
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Velopack package
        shell: powershell
        run: |
          $fetchReleaseHistory = "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true"
          ./scripts/build-windows-installers.ps1 `
            -Platforms "${{ matrix.platform }}" `
            -Version "${{ steps.version.outputs.value }}" `
            -RepoUrl "https://github.com/${{ github.repository }}" `
            -GitHubToken "${{ github.token }}" `
            -FetchReleaseHistory:$fetchReleaseHistory

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ matrix.platform }}
          path: artifacts/velopack/packages/${{ matrix.channel }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download x86 package
        uses: actions/download-artifact@v4
        with:
          name: windows-package-x86
          path: release-assets/win-x86

      - name: Download x64 package
        uses: actions/download-artifact@v4
        with:
          name: windows-package-x64
          path: release-assets/win-x64

      - name: Inspect downloaded assets
        shell: powershell
        run: |
          Write-Host "x86 assets:"
          Get-ChildItem release-assets/win-x86 -File -Recurse | Sort-Object FullName | ForEach-Object { Write-Host " - $($_.FullName)" }
          Write-Host "x64 assets:"
          Get-ChildItem release-assets/win-x64 -File -Recurse | Sort-Object FullName | ForEach-Object { Write-Host " - $($_.FullName)" }

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $version = $tag.TrimStart('v')
          $releaseTitle = "VaultPilot $version"
          $PSNativeCommandUseErrorActionPreference = $false
          $apiHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $apiBase = "https://api.github.com/repos/$repo"
          $release = $null

          try {
            $release = Invoke-RestMethod `
              -Method Get `
              -Uri "$apiBase/releases/tags/$tag" `
              -Headers $apiHeaders
          } catch {
            $statusCode = $null
            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }

            if ($statusCode -ne 404) {
              throw
            }
          }

          if (-not $release) {
            $releasePayload = @{
              tag_name = $tag
              name = $releaseTitle
              body = ""
              draft = $false
              prerelease = $false
            } | ConvertTo-Json

            $release = Invoke-RestMethod `
              -Method Post `
              -Uri "$apiBase/releases" `
              -Headers $apiHeaders `
              -ContentType "application/json" `
              -Body $releasePayload
          }

          $existingAssetNames = @{}
          foreach ($asset in @($release.assets)) {
            if (-not [string]::IsNullOrWhiteSpace($asset.name)) {
              $existingAssetNames[$asset.name.Trim()] = $true
            }
          }

          function Upload-ReleaseAssets {
            param(
              [string]$Directory,
              [hashtable]$KnownAssets
            )

            $assets = Get-ChildItem $Directory -File -Recurse | Where-Object {
              $_.Name -match 'Setup\.exe$' -or
              $_.Name -match '-full\.nupkg$' -or
              $_.Name -match '^releases\..+\.json$' -or
              $_.Name -match '^RELEASES-.+$'
            } | Sort-Object Name

            if (-not $assets) {
              throw "No release assets found in $Directory"
            }

            foreach ($asset in $assets) {
              if ($KnownAssets.ContainsKey($asset.Name)) {
                Write-Host "Skipping existing asset $($asset.Name)"
                continue
              }

              Write-Host "Uploading $($asset.Name)..."
              gh release upload $tag $asset.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to upload asset $($asset.Name)"
              }

              $KnownAssets[$asset.Name] = $true
            }
          }

          Upload-ReleaseAssets -Directory "release-assets/win-x86" -KnownAssets $existingAssetNames
          Upload-ReleaseAssets -Directory "release-assets/win-x64" -KnownAssets $existingAssetNames
