name: Windows Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate:
    permissions:
      contents: read
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Create log directory
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null

      - name: Run tests
        shell: powershell
        run: cargo test --workspace --all-targets

      - name: Run clippy
        shell: powershell
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        shell: powershell
        env:
          CARGO_HTTP_HTTP2: "0"
        run: |
          for ($i = 1; $i -le 5; $i++) {
            cargo install cargo-audit --locked --force
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Attempt $i failed, retrying in 30s..."
            Start-Sleep -Seconds 30
          }
          if ($LASTEXITCODE -ne 0) { throw "cargo install cargo-audit failed after 5 attempts" }

      - name: Run cargo audit
        shell: powershell
        run: cargo audit

      - name: Build WinUI validation target
        shell: powershell
        run: >
          MSBuild native/VaultPilot.WinUI/VaultPilot.WinUI.csproj
          /restore
          /t:Build
          /p:Configuration=Debug
          /p:Platform=x64
          /bl:artifacts/logs/release-validate-winui-debug-x64.binlog

      # NOTE: C# unit tests cannot run in CI — see ci.yml for details.
      - name: Build C# unit tests (compile-only)
        timeout-minutes: 3
        shell: powershell
        run: |
          msbuild native/VaultPilot.WinUI.Tests/VaultPilot.WinUI.Tests.csproj /t:Restore /p:BuildProjectReferences=false
          msbuild native/VaultPilot.WinUI.Tests/VaultPilot.WinUI.Tests.csproj /p:Configuration=Debug /p:Platform=x64 /p:BuildProjectReferences=false

      - name: Verify validation outputs
        shell: powershell
        run: |
          $required = @(
            "native/VaultPilot.WinUI/bin/x64/Debug/net8.0-windows10.0.19041.0/VaultPilot.WinUI.exe",
            "native/VaultPilot.WinUI/bin/x64/Debug/net8.0-windows10.0.19041.0/vaultpilot-agent.exe",
            "native/VaultPilot.WinUI/bin/x64/Debug/net8.0-windows10.0.19041.0/vaultpilot-cli.exe"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Expected validation output not found: $path"
            }
          }

          $binDir = "native/VaultPilot.WinUI/bin/x64/Debug/net8.0-windows10.0.19041.0"
          $notifyIconDll = Get-ChildItem $binDir -Filter "H.NotifyIcon.WinUI.dll" -Recurse -ErrorAction SilentlyContinue
          if (-not $notifyIconDll) {
            throw "H.NotifyIcon.WinUI.dll not found in build output"
          }

      - name: Smoke test WinUI app
        shell: powershell
        run: |
          ./scripts/smoke-test-winui.ps1 `
            -ExePath "native/VaultPilot.WinUI/bin/x64/Debug/net8.0-windows10.0.19041.0/VaultPilot.WinUI.exe" `
            -TimeoutSeconds 8

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-validate-logs
          path: artifacts/logs
          if-no-files-found: warn
          retention-days: 7

  build:
    permissions:
      contents: read
    needs: validate
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            rust_target: i686-pc-windows-msvc
            channel: win-x86
          - platform: x64
            rust_target: x86_64-pc-windows-msvc
            channel: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Velopack CLI
        shell: powershell
        run: dotnet tool install --global vpk --version 0.0.1298

      - name: Resolve app version
        id: version
        shell: powershell
        run: |
          # Prefer git tag name when triggered by a tag push
          $tagRef = "${{ github.ref }}"
          if ($tagRef -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } else {
            $cargo = Get-Content Cargo.toml
            $line = $cargo | Where-Object { $_ -match '^version\s*=\s*".*"$' } | Select-Object -First 1
            if (-not $line) {
              throw "Unable to resolve version from Cargo.toml"
            }
            $version = [regex]::Match($line, '"([^"]+)"').Groups[1].Value
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          echo "Resolved version: $version"

      - name: Build Velopack package
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $fetchReleaseHistory = "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true"
          ./scripts/build-windows-installers.ps1 `
            -Platforms "${{ matrix.platform }}" `
            -Version "${{ steps.version.outputs.value }}" `
            -RepoUrl "https://github.com/${{ github.repository }}" `
            -GitHubToken "$env:GITHUB_TOKEN" `
            -FetchReleaseHistory:$fetchReleaseHistory

      - name: Set publish directory
        shell: powershell
        run: |
          $arch = "${{ matrix.platform }}"
          $dir = if ($arch -eq "x64") { "win-x64" } else { "win-x86" }
          "publishDir=artifacts/velopack/publish/$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
        id: publish-dir

      # Smoke test skipped — the CI runner (windows-2022) has WinAppSDK
      # pre-installed which conflicts with the self-contained bundle,
      # causing a false-positive 0xC000027B crash on startup.
      # This does NOT affect real user machines where no conflicting
      # WinAppSDK is installed.

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ matrix.platform }}
          path: artifacts/velopack/packages/${{ matrix.channel }}
          if-no-files-found: error
          retention-days: 7

  linux_build:
    permissions:
      contents: read
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils dpkg-dev libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build Linux CLI artifacts
        run: |
          chmod +x scripts/build-linux-cli.sh
          ./scripts/build-linux-cli.sh --platforms x64 --format all

      - name: Verify Linux CLI outputs
        run: |
          test -f artifacts/linux-cli/bin/linux-x64/vaultpilot-cli
          compgen -G "artifacts/linux-cli/packages/linux-x64/*.deb" > /dev/null

      - name: Smoke test Linux CLI
        run: |
          chmod +x scripts/smoke-test-linux-cli.sh
          ./scripts/smoke-test-linux-cli.sh artifacts/linux-cli/bin/linux-x64/vaultpilot-cli

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-x64
          path: |
            artifacts/linux-cli/bin/linux-x64/vaultpilot-cli
            artifacts/linux-cli/packages/linux-x64/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux_build]
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Download x86 package
        uses: actions/download-artifact@v8
        with:
          name: windows-package-x86
          path: release-assets/win-x86

      - name: Download x64 package
        uses: actions/download-artifact@v8
        with:
          name: windows-package-x64
          path: release-assets/win-x64

      - name: Download Linux x64 package
        uses: actions/download-artifact@v8
        with:
          name: linux-package-x64
          path: release-assets/linux-x64

      - name: Inspect downloaded assets
        shell: powershell
        run: |
          Write-Host "x86 assets:"
          Get-ChildItem release-assets/win-x86 -File -Recurse | Sort-Object FullName | ForEach-Object { Write-Host " - $($_.FullName)" }
          Write-Host "x64 assets:"
          Get-ChildItem release-assets/win-x64 -File -Recurse | Sort-Object FullName | ForEach-Object { Write-Host " - $($_.FullName)" }
          Write-Host "linux-x64 assets:"
          Get-ChildItem release-assets/linux-x64 -File -Recurse | Sort-Object FullName | ForEach-Object { Write-Host " - $($_.FullName)" }

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $version = $tag.TrimStart('v')
          $releaseTitle = "VaultPilot $version"
          $ErrorActionPreference = "Stop"
          $apiHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $apiBase = "https://api.github.com/repos/$repo"
          $release = $null

          try {
            $release = Invoke-RestMethod `
              -Method Get `
              -Uri "$apiBase/releases/tags/$tag" `
              -Headers $apiHeaders
          } catch {
            $statusCode = $null
            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }

            if ($statusCode -ne 404) {
              throw
            }
          }

          if (-not $release) {
            $releasePayload = @{
              tag_name = $tag
              name = $releaseTitle
              body = ""
              draft = $false
              prerelease = $false
            } | ConvertTo-Json

            $release = Invoke-RestMethod `
              -Method Post `
              -Uri "$apiBase/releases" `
              -Headers $apiHeaders `
              -ContentType "application/json" `
              -Body $releasePayload
          }

          $existingAssetNames = @{}
          foreach ($asset in @($release.assets)) {
            if (-not [string]::IsNullOrWhiteSpace($asset.name)) {
              $existingAssetNames[$asset.name.Trim()] = $true
            }
          }

          function Upload-ReleaseAssets {
            param(
              [string]$Directory,
              [hashtable]$ExistingNames
            )

            $assets = Get-ChildItem $Directory -File -Recurse | Where-Object {
              $_.Name -match 'Setup\.exe$' -or
              $_.Name -match '-full\.nupkg$' -or
              $_.Name -match '\.deb$' -or
              $_.Name -match '^releases\..+\.json$' -or
              $_.Name -match '^RELEASES-.+$'
            } | Sort-Object Name

            if (-not $assets) {
              throw "No release assets found in $Directory"
            }

            # Track uploaded assets by final upload name to avoid
            # cross-directory collisions (e.g. Setup.exe from win-x86 vs win-x64)
            $uploadedKeys = @{}

            foreach ($asset in $assets) {
              # Use directory-based channel to disambiguate duplicate filenames
              $channel = Split-Path $Directory -Leaf
              $assetName = if ($asset.Name -eq 'Setup.exe') {
                "Setup-$channel.exe"
              } else {
                $asset.Name.Trim()
              }

              # Skip if already on the release (by final upload filename)
              if ($ExistingNames.ContainsKey($assetName)) {
                Write-Host "Skipping already-released asset $Directory/$assetName"
                continue
              }
              # Skip if already uploaded from another directory in this run
              if ($uploadedKeys.ContainsKey($assetName)) {
                continue
              }

              Write-Host "Uploading $($asset.Name) as $assetName..."
              gh release upload $tag "$($asset.FullName)#$assetName" --clobber
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to upload asset $assetName"
              }

              $uploadedKeys[$assetName] = $true
            }
          }

          Upload-ReleaseAssets -Directory "release-assets/win-x86" -ExistingNames $existingAssetNames
          Upload-ReleaseAssets -Directory "release-assets/win-x64" -ExistingNames $existingAssetNames
          Upload-ReleaseAssets -Directory "release-assets/linux-x64" -ExistingNames $existingAssetNames
