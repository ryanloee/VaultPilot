name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/auto-merge-main
        with:
          base-repo-clone-url: ${{ github.event.pull_request.base.repo.clone_url }}
          base-ref: ${{ github.base_ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fmt-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fmt-

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/auto-merge-main
        with:
          base-repo-clone-url: ${{ github.event.pull_request.base.repo.clone_url }}
          base-ref: ${{ github.base_ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/auto-merge-main
        with:
          base-repo-clone-url: ${{ github.event.pull_request.base.repo.clone_url }}
          base-ref: ${{ github.base_ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --workspace

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/auto-merge-main
        with:
          base-repo-clone-url: ${{ github.event.pull_request.base.repo.clone_url }}
          base-ref: ${{ github.base_ref }}

      - name: Install cargo-audit
        run: |
          for i in 1 2 3 4 5; do
            cargo install cargo-audit --locked --force && break
            if [ "$i" -lt 5 ]; then
              echo "Attempt $i failed, retrying in 30s..."
              sleep 30
            else
              echo "Attempt $i failed, giving up"
            fi
          done
          if ! command -v cargo-audit &>/dev/null; then
            echo "FATAL: cargo-audit installation failed after 5 attempts"
            exit 1
          fi

      - name: Run cargo audit
        # #3741: yanked/unmaintained/unsound crates must fail the gate, not
        # just print a warning.
        run: cargo audit --deny warnings

  linux_cli_build:
    name: linux-cli-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/auto-merge-main
        with:
          base-repo-clone-url: ${{ github.event.pull_request.base.repo.clone_url }}
          base-ref: ${{ github.base_ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      # #2664/#3601: fmt is already gated by the dedicated fmt job; running
      # it again here wastes runner minutes.
      - run: cargo build --release

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-cli
          path: target/release/vaultpilot-cli
          if-no-files-found: error
          retention-days: 7

  winui_build:
    name: winui-build
    runs-on: windows-2022
    # #3954: a hung smoke step must fail fast instead of burning GitHub's
    # default 6h budget and cancelling every other PR gate.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/auto-merge-main
        with:
          base-repo-clone-url: ${{ github.event.pull_request.base.repo.clone_url }}
          base-ref: ${{ github.base_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('native/VaultPilot.WinUI/VaultPilot.WinUI.csproj', 'native/VaultPilot.WinUI.Tests/VaultPilot.WinUI.Tests.csproj') }}

      - name: Build WinUI project
        run: msbuild native/VaultPilot.WinUI/VaultPilot.WinUI.csproj /restore /p:Configuration=Release /p:Platform=x64

      # NOTE: C# unit tests cannot run in CI because the test project references
      # VaultPilot.WinUI.dll which triggers WinRT runtime activation that hangs
      # in headless CI runners. The build step below verifies test compilation.
      # Tracked in #597 — fix requires extracting model classes into a
      # non-UI shared project.
      - name: Build C# unit tests (compile-only)
        timeout-minutes: 3
        shell: powershell
        run: |
          msbuild native/VaultPilot.WinUI.Tests/VaultPilot.WinUI.Tests.csproj /t:Restore /p:BuildProjectReferences=false
          msbuild native/VaultPilot.WinUI.Tests/VaultPilot.WinUI.Tests.csproj /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=false

      - name: Smoke test WinUI app
        shell: powershell
        run: |
          ./scripts/smoke-test-winui.ps1 `
            -ExePath "native/VaultPilot.WinUI/bin/x64/Release/net8.0-windows10.0.19041.0/VaultPilot.WinUI.exe" `
            -TimeoutSeconds 8

      # PR gate: Rust backend agent must start, answer JSON-RPC, and survive
      # a heartbeat window (see smoke-test-agent.ps1).
      - name: Smoke test agent backend
        shell: powershell
        run: |
          ./scripts/smoke-test-agent.ps1 `
            -ExePath "native/VaultPilot.WinUI/bin/x64/Release/net8.0-windows10.0.19041.0/vaultpilot-agent.exe" `
            -HeartbeatSeconds 20
