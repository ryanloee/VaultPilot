# Regression Test Check
#
# Runs on PRs to verify that bug-fix PRs include regression tests.
# Does NOT block merge — it posts a warning comment instead.

name: Regression Test Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-regression:
    name: Check regression tests
    runs-on: ubuntu-latest
    # Only run when PR has the 'bug' label
    if: contains(github.event.pull_request.labels.*.name, 'bug') || contains(github.event.pull_request.labels.*.name, 'regression')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for regression test
        id: check
        run: |
          echo "Checking if bug-fix PR includes regression test..."
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qi "regression/"; then
            echo "has_regression=true" >> "$GITHUB_OUTPUT"
            echo "✅ PR includes regression test changes"
          else
            echo "has_regression=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Bug-fix PR is missing a regression test"
          fi

      - name: Comment if missing
        if: steps.check.outputs.has_regression == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Missing Regression Test

            This PR is labeled **bug** but does not include a regression test.

            Please add a regression test that reproduces the original bug:

            | Platform | Location |
            |----------|----------|
            | Rust/CLI | \`src/regression/issue_NNN_short_desc.rs\` |

            See [\`docs/TESTING.md\`](../docs/TESTING.md) for templates and conventions.

            **Why?** Regression tests prevent the same bug from being reintroduced.`
            })
