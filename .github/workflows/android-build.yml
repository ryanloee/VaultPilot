name: Android Build

on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Expo export (bundle check)
        run: npx expo export --platform android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"  # e.g. v0.3.14
          VERSION="${TAG#v}"             # 0.3.14
          # Extract versionCode from tag: 0.3.14 -> 314 (major*100 + minor*10 + patch, but simpler: strip dots)
          VERSION_CODE=$(echo "$VERSION" | tr -d '.')
          echo "VERSION_NAME=$VERSION VERSION_CODE=$VERSION_CODE"
          # Update app.json in-place
          python3 -c "
          import json
          with open('app.json') as f: cfg = json.load(f)
          cfg['expo']['version'] = '$VERSION'
          cfg['expo']['android']['versionCode'] = int('$VERSION_CODE')
          with open('app.json', 'w') as f: json.dump(cfg, f, indent=2)
          "

      - name: Expo prebuild (generate native project)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Validate APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "FAILED: APK not found"
            exit 1
          fi

          # File is a valid ZIP (APK = ZIP)
          python3 -c "
          import zipfile, sys
          z = zipfile.ZipFile('$APK')
          names = z.namelist()
          # Must contain AndroidManifest.xml and classes.dex
          assert 'AndroidManifest.xml' in names, f'Missing AndroidManifest.xml, got: {names[:10]}'
          assert any('classes.dex' in n for n in names), f'Missing classes.dex, got: {names[:10]}'
          # Check size is reasonable (>1MB for a real app, <200MB)
          import os
          size_mb = os.path.getsize('$APK') / (1024*1024)
          assert 1 < size_mb < 200, f'APK size {size_mb:.1f}MB is unreasonable'
          print(f'APK valid: {size_mb:.1f}MB, {len(names)} entries')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: release-assets/android

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="release-assets/android/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK"
            exit 1
          fi

          if ! gh release view "$TAG" --json id > /dev/null 2>&1; then
            gh release create "$TAG" --title "VaultPilot ${TAG#v}" --notes ""
          fi

          gh release upload "$TAG" "$APK" --clobber
          echo "Uploaded APK to release $TAG"
