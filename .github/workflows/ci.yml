name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REPO_CLONE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$BASE_REPO_CLONE_URL"
          git fetch upstream "$BASE_REF"
          git merge --no-edit "upstream/$BASE_REF" || { echo "⚠️ Merge conflict with main — please rebase your branch"; exit 1; }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fmt-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fmt-

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REPO_CLONE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$BASE_REPO_CLONE_URL"
          git fetch upstream "$BASE_REF"
          git merge --no-edit "upstream/$BASE_REF" || { echo "⚠️ Merge conflict with main — please rebase your branch"; exit 1; }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REPO_CLONE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$BASE_REPO_CLONE_URL"
          git fetch upstream "$BASE_REF"
          git merge --no-edit "upstream/$BASE_REF" || { echo "⚠️ Merge conflict with main — please rebase your branch"; exit 1; }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --workspace

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REPO_CLONE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$BASE_REPO_CLONE_URL"
          git fetch upstream "$BASE_REF"
          git merge --no-edit "upstream/$BASE_REF" || { echo "⚠️ Merge conflict with main — please rebase your branch"; exit 1; }

      - name: Install cargo-audit
        run: |
          for i in 1 2 3 4 5; do
            cargo install cargo-audit --locked --force && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          if ! command -v cargo-audit &>/dev/null; then
            echo "FATAL: cargo-audit installation failed after 5 attempts"
            exit 1
          fi

      - name: Run cargo audit
        run: cargo audit

  linux_cli_build:
    name: linux-cli-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REPO_CLONE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$BASE_REPO_CLONE_URL"
          git fetch upstream "$BASE_REF"
          git merge --no-edit "upstream/$BASE_REF" || { echo "⚠️ Merge conflict with main — please rebase your branch"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - run: cargo build --release

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-cli
          path: target/release/vaultpilot-cli
          if-no-files-found: error
          retention-days: 7

  tauri_desktop_build:
    name: tauri-desktop-build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REPO_CLONE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$BASE_REPO_CLONE_URL"
          git fetch upstream "$BASE_REF"
          git merge --no-edit "upstream/$BASE_REF" || { echo "⚠️ Merge conflict with main — please rebase your branch"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: desktop
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check Tauri backend
        run: cargo check -p vaultpilot-desktop
