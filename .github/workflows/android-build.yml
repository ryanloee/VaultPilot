name: Android Build

on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        env:
          CLONE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream $CLONE_URL
          git fetch upstream $BASE_REF
          git merge --no-edit upstream/$BASE_REF || { echo "⚠️ Merge conflict with main — please rebase your branch"; exit 1; }

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Verify React version consistency
        run: npm run check-react

      - name: Run tests
        run: npm test

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Expo export (bundle check)
        run: npx expo export --platform android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"  # e.g. v0.4.9 or v0.5.0-rc1
          VERSION="${TAG#v}"  # 0.4.9 or 0.5.0-rc1

          # Split pre-release suffix for versionCode computation (#2536)
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            VERSION_BASE="${VERSION%%-*}"
          else
            PRERELEASE=""
            VERSION_BASE="$VERSION"
          fi

          # versionCode: major*10000 + minor*100 + patch (monotonically increasing)
          # 0.3.55 -> 3055, 0.4.9 -> 409 — always increasing
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_BASE"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          # For pre-release tags, offset versionCode to avoid collision with release (#2536)
          if [ -n "$PRERELEASE" ]; then
            # Extract numeric suffix (e.g., rc1 -> 1)
            PR_NUM="${PRERELEASE##*[!0-9]}"
            [[ "$PR_NUM" =~ ^[0-9]+$ ]] || PR_NUM=0
            # Multiply and add pre-release number to ensure unique, monotonic versionCode
            VERSION_CODE=$((VERSION_CODE * 100 + PR_NUM))
          fi

          echo "VERSION_NAME=$VERSION VERSION_CODE=$VERSION_CODE"
          # Update app.json in-place — pass values as args to avoid shell injection (#2478)
          python3 -c "
          import json, sys
          version = sys.argv[1]
          version_code = int(sys.argv[2])
          with open('app.json') as f:
              cfg = json.load(f)
          cfg['expo']['version'] = version
          cfg['expo']['android']['versionCode'] = version_code
          with open('app.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          " "$VERSION" "$VERSION_CODE"

      - name: Expo prebuild (generate native project)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Validate APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "FAILED: APK not found"
            exit 1
          fi

          # File is a valid ZIP (APK = ZIP) — use explicit if/raise instead of assert (#2492)
          python3 -c "
          import zipfile, os, sys

          z = zipfile.ZipFile('$APK')
          names = z.namelist()

          # Must contain AndroidManifest.xml and classes.dex
          if 'AndroidManifest.xml' not in names:
              sys.exit('FAILED: Missing AndroidManifest.xml, got: ' + str(names[:10]))
          if not any('classes.dex' in n for n in names):
              sys.exit('FAILED: Missing classes.dex, got: ' + str(names[:10]))

          # Check size is reasonable (>1MB for a real app, <200MB)
          size_mb = os.path.getsize('$APK') / (1024 * 1024)
          if not (1 < size_mb < 200):
              sys.exit('FAILED: APK size {:.1f}MB is unreasonable'.format(size_mb))

          print('APK valid: {:.1f}MB, {} entries'.format(size_mb, len(names)))
          "

      - uses: actions/upload-artifact@v4
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: release-assets/android

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"
          APK="release-assets/android/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK"
            exit 1
          fi

          if ! gh release view "$TAG" --json id > /dev/null 2>&1; then
            gh release create "$TAG" --title "VaultPilot ${TAG#v}" --notes ""
          fi

          gh release upload "$TAG" "$APK" --clobber
          echo "Uploaded APK to release $TAG"
