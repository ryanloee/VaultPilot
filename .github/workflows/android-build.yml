name: Android Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
  workflow_dispatch:

jobs:
  build:
    # #3428: the `paths` filter was removed from the `push` trigger because it
    # applied to tag pushes too, silently skipping 55% of release tags (157/285
    # whose commits did not touch mobile/) and leaving those releases without
    # an APK. Branch pushes are gated here instead: run when the push commits
    # touch mobile/ or this workflow. Tag pushes, PRs and manual dispatches
    # always run.
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(toJson(github.event.commits), 'mobile/') ||
      contains(toJson(github.event.commits), 'android-build.yml')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Auto-merge main (PR only)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/auto-merge-main
        with:
          base-repo-clone-url: ${{ github.event.pull_request.base.repo.clone_url }}
          base-ref: ${{ github.base_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Verify React version consistency
        run: npm run check-react

      - name: Run tests
        run: npm test

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Expo export (bundle check)
        run: npx expo export --platform android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"  # e.g. v0.4.9 or v0.5.0-rc1
          VERSION="${TAG#v}"  # 0.4.9 or 0.5.0-rc1

          # Split pre-release suffix for versionCode computation (#2536)
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            VERSION_BASE="${VERSION%%-*}"
          else
            PRERELEASE=""
            VERSION_BASE="$VERSION"
          fi

          # versionCode scheme (#2667, #2976, #2990, #3592, #3635):
          #   base       = major*1_000_000 + minor*1_000 + patch
          #   prerelease = base*1000 + rc            (rc in 0..998)
          #   release    = base*1000 + 999
          # This keeps every rc of X.Y.Z below the X.Y.Z release, the next
          # patch's rc0 above this release, rc >= 10 collision-free, and
          # patch >= 100 from overflowing into the minor slot.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_BASE"
          BASE_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          if [ -z "$PRERELEASE" ]; then
            VERSION_CODE=$((BASE_CODE * 1000 + 999))
          else
            PR_NUM="${PRERELEASE##*[!0-9]}"
            [[ "$PR_NUM" =~ ^[0-9]+$ ]] || PR_NUM=0
            # Reserve 999 for the release code; cap rc at 998 so rc values
            # never collide with the release or with each other (#3635).
            if [ "$PR_NUM" -gt 998 ]; then
              PR_NUM=998
            fi
            VERSION_CODE=$((BASE_CODE * 1000 + PR_NUM))
          fi

          echo "VERSION_NAME=$VERSION VERSION_CODE=$VERSION_CODE"
          # Update app.json in-place — pass values as args to avoid shell injection (#2478)
          python3 -c "
          import json, sys
          version = sys.argv[1]
          version_code = int(sys.argv[2])
          with open('app.json') as f:
              cfg = json.load(f)
          cfg['expo']['version'] = version
          cfg['expo']['android']['versionCode'] = version_code
          with open('app.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          " "$VERSION" "$VERSION_CODE"

      - name: Expo prebuild (generate native project)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Validate APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "FAILED: APK not found"
            exit 1
          fi

          # File is a valid ZIP (APK = ZIP) — use explicit if/raise instead of assert (#2492)
          python3 -c "
          import zipfile, os, sys

          z = zipfile.ZipFile('$APK')
          names = z.namelist()

          # Must contain AndroidManifest.xml and classes.dex
          if 'AndroidManifest.xml' not in names:
              sys.exit('FAILED: Missing AndroidManifest.xml, got: ' + str(names[:10]))
          if not any('classes.dex' in n for n in names):
              sys.exit('FAILED: Missing classes.dex, got: ' + str(names[:10]))

          # Check size is reasonable (>1MB for a real app, <200MB)
          size_mb = os.path.getsize('$APK') / (1024 * 1024)
          if not (1 < size_mb < 200):
              sys.exit('FAILED: APK size {:.1f}MB is unreasonable'.format(size_mb))

          print('APK valid: {:.1f}MB, {} entries'.format(size_mb, len(names)))
          "

      - uses: actions/upload-artifact@v7
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: release-assets/android

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"
          # #2765: upload-artifact preserves the mobile/ prefix, so the
          # downloaded artifact lands under mobile/android/... — match the
          # real path instead of expecting a bare app-release.apk.
          APK="release-assets/android/mobile/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK"
            exit 1
          fi

          if ! gh release view "$TAG" --json id > /dev/null 2>&1; then
            gh release create "$TAG" --title "VaultPilot ${TAG#v}" --notes ""
          fi

          gh release upload "$TAG" "$APK" --clobber
          echo "Uploaded APK to release $TAG"
