name: Linux CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the Zig toolchain version + hash.
      # Update both values together when bumping Zig (issue #2457).
      ZIG_VERSION: "0.14.0"
      ZIG_SHA256: "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils dpkg-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Zig
        run: |
          mkdir -p "$HOME/.local/zig"
          cd "$HOME/.local/zig"
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$HOME/.local/zig/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build Linux CLI artifacts
        run: |
          chmod +x scripts/build-linux-cli.sh
          ./scripts/build-linux-cli.sh --platforms x64 --format all

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultpilot-cli-linux-x64
          path: |
            artifacts/linux-cli/bin/linux-x64/vaultpilot-cli
            artifacts/linux-cli/packages/linux-x64/*.deb
          if-no-files-found: error
          retention-days: 7
