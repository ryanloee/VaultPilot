name: Android Build

on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths: [mobile/**, .github/workflows/android-build.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Expo export (bundle check)
        run: npx expo export --platform android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild (generate native project)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: vaultpilot-android-${{ github.sha }}
          path: release-assets/android

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="release-assets/android/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK"
            exit 1
          fi

          # Create release if it doesn't exist yet
          if ! gh release view "$TAG" --json id > /dev/null 2>&1; then
            gh release create "$TAG" --title "VaultPilot ${TAG#v}" --notes ""
          fi

          # Upload APK (skip if already exists)
          gh release upload "$TAG" "$APK" --clobber
          echo "Uploaded APK to release $TAG"
