name: Android Build (Tauri)

on:
  push:
    branches: [main]
    paths: [desktop/**, .github/workflows/android-build.yml]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths: [desktop/**, .github/workflows/android-build.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: desktop
        run: pnpm build

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import json
          version = "${{ github.ref_name }}".lstrip("v")
          p = "desktop/src-tauri/tauri.conf.json"
          with open(p, encoding="utf-8") as f:
              conf = json.load(f)
          conf["version"] = version
          with open(p, "w", encoding="utf-8") as f:
              json.dump(conf, f, indent=2)
          EOF

      - name: Initialize Android project (if missing)
        working-directory: desktop
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init
          fi

      - name: Build APK
        working-directory: desktop
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: pnpm tauri android build --target ${{ matrix.target }} --apk

      - name: Validate APK
        run: |
          APK=$(find desktop/src-tauri/gen/android -path '*/outputs/apk/*/release/*.apk' | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "FAILED: APK not found"
            exit 1
          fi
          python3 - "$APK" <<'EOF'
          import zipfile, os, sys
          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          if "AndroidManifest.xml" not in names:
              sys.exit("FAILED: Missing AndroidManifest.xml, got: " + str(names[:10]))
          if not any("classes.dex" in n for n in names):
              sys.exit("FAILED: Missing classes.dex, got: " + str(names[:10]))
          size_mb = os.path.getsize(apk) / (1024 * 1024)
          if not (1 < size_mb < 200):
              sys.exit("FAILED: APK size {:.1f}MB is unreasonable".format(size_mb))
          print("APK valid: {:.1f}MB, {} entries".format(size_mb, len(names)))
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: vaultpilot-android-${{ matrix.target }}-${{ github.sha }}
          path: desktop/src-tauri/gen/android/**/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets/android
          pattern: vaultpilot-android-*-${{ github.sha }}
          merge-multiple: true

      - name: Upload APKs to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" --json id > /dev/null 2>&1; then
            gh release create "$TAG" --title "VaultPilot ${TAG#v}" --notes ""
          fi
          for apk in release-assets/android/*.apk; do
            gh release upload "$TAG" "$apk" --clobber
          done
