name: Android Build (Tauri)

on:
  push:
    branches: [main]
    paths: [desktop/**, .github/workflows/android-build.yml]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths: [desktop/**, .github/workflows/android-build.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: aarch64
            rust_target: aarch64-linux-android
          - abi: armv7
            rust_target: armv7-linux-androideabi
          - abi: x86_64
            rust_target: x86_64-linux-android

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "ndk;26.1.10909125"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: desktop
        run: pnpm build

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import json
          version = "${{ github.ref_name }}".lstrip("v")
          p = "desktop/src-tauri/tauri.conf.json"
          with open(p, encoding="utf-8") as f:
              conf = json.load(f)
          conf["version"] = version
          with open(p, "w", encoding="utf-8") as f:
              json.dump(conf, f, indent=2)
          EOF

      - name: Initialize Android project (if missing)
        working-directory: desktop
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init
          fi

      - name: Build APK
        working-directory: desktop
        run: pnpm tauri android build --target ${{ matrix.abi }} --apk

      # v0.7.16 shipped unsigned APKs — Android refuses to install them.
      # Sign the release APK with a keystore generated on the fly. The same
      # keystore is regenerated per-build (self-signed), so sideloaded
      # installs work; a stable production keystore can be added later.
      - name: Sign APK
        run: |
          set -euo pipefail
          APK=$(find desktop/src-tauri/gen/android -path '*/outputs/apk/*/release/*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "FAILED: APK not found for signing"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          KS_PASS="${ANDROID_KEYSTORE_PASSWORD:-vaultpilot}"
          ALIAS="${ANDROID_KEY_ALIAS:-vaultpilot}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-vaultpilot}"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$KS_PASS" \
            -alias "$ALIAS" \
            -keypass "$KEY_PASS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VaultPilot, OU=Mobile, O=VaultPilot, L=City, ST=State, C=CN" \
            >/dev/null 2>&1

          # Locate apksigner (bundled with Android SDK build-tools).
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "FAILED: apksigner not found"
            exit 1
          fi

          UNSIGNED="${APK%.apk}-unsigned.apk"
          cp "$APK" "$UNSIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$ALIAS" \
            --out "$APK" \
            "$UNSIGNED"
          rm -f "$UNSIGNED"
          echo "Signed APK: $APK"

          # Verify the signature actually landed — fail the build if not.
          "$APKSIGNER" verify --print-certs "$APK" | head -5
          echo "APK signature verified OK"

      - name: Validate APK
        run: |
          APK=$(find desktop/src-tauri/gen/android -path '*/outputs/apk/*/release/*.apk' | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "FAILED: APK not found"
            exit 1
          fi
          python3 - "$APK" <<'EOF'
          import zipfile, os, sys
          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          if "AndroidManifest.xml" not in names:
              sys.exit("FAILED: Missing AndroidManifest.xml, got: " + str(names[:10]))
          if not any("classes.dex" in n for n in names):
              sys.exit("FAILED: Missing classes.dex, got: " + str(names[:10]))
          size_mb = os.path.getsize(apk) / (1024 * 1024)
          if not (1 < size_mb < 200):
              sys.exit("FAILED: APK size {:.1f}MB is unreasonable".format(size_mb))
          print("APK valid: {:.1f}MB, {} entries".format(size_mb, len(names)))
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: vaultpilot-android-${{ matrix.abi }}-${{ github.sha }}
          path: desktop/src-tauri/gen/android/**/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vaultpilot-android-*-${{ github.sha }}

      - name: Upload APKs to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" --json id > /dev/null 2>&1; then
            gh release create "$TAG" --title "VaultPilot ${TAG#v}" --notes ""
          fi
          for apk in $(find vaultpilot-android-* -name '*.apk'); do
            top=${apk%%/*}
            abi=${top#vaultpilot-android-}
            abi=${abi%%-*}
            gh release upload "$TAG" "$apk#VaultPilot-${abi}-${TAG}.apk" --clobber
          done